# lab-hard/waf/crs-pl2-strict.conf — CRS4 PL2 strict overlay (REQUEST-999).
# Mounted as /etc/modsecurity.d/owasp-crs/rules/REQUEST-999-HARD-STRICT.conf
# INTENTIONALLY STRICT — lab only. Complements included CRS REQUEST-942-* rules.

SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off

# --- Paranoia 2 + anomaly threshold 5 (CRS4 style) ---
SecAction "id:900000,phase:1,nolog,pass,\
  setvar:tx.paranoia_level=2,\
  setvar:tx.executing_paranoia_level=2,\
  setvar:tx.inbound_anomaly_score_threshold=5,\
  setvar:tx.critical_anomaly_score=5,\
  setvar:tx.error_anomaly_score=4,\
  setvar:tx.warning_anomaly_score=3,\
  setvar:tx.notice_anomaly_score=2"

# --- Force JSON body processor so Team82-style JSON-SQLi is inspected ---
SecRule REQUEST_HEADERS:Content-Type "@contains json" \
  "id:901100,phase:1,pass,nolog,ctl:requestBodyProcessor=JSON"

# --- CVE-2026-42208 hardening: SQLi in Authorization: Bearer ---
SecRule REQUEST_HEADERS:Authorization "@detectSQLi" \
  "id:942900,phase:2,block,capture,msg:'SQLi in Authorization (CVE-2026-42208 hardening)',\
  logdata:'%{MATCHED_VAR}',tag:'attack-sqli',tag:'paranoia-level/2',\
  ver:'OWASP_CRS/4.0',severity:'CRITICAL',\
  setvar:'tx.inbound_anomaly_score_pl2=+%{tx.critical_anomaly_score}'"
SecRule REQUEST_HEADERS:Authorization "@rx (?i)(union\s+(all\s+)?select|/\*!|\bextractvalue\b|\bupdatexml\b|pg_sleep|xp_dirtree|utl_inaddr|dbms_ldap|json_extract|json_value|->>)" \
  "id:942901,phase:2,block,capture,msg:'SQLi keywords in Authorization',\
  tag:'attack-sqli',tag:'paranoia-level/2',ver:'OWASP_CRS/4.0',severity:'CRITICAL',\
  setvar:'tx.inbound_anomaly_score_pl2=+%{tx.critical_anomaly_score}'"

# --- 920320: missing/empty User-Agent (catches faceless probes) ---
SecRule &REQUEST_HEADERS:User-Agent "@eq 0" \
  "id:920320,phase:1,block,msg:'Missing User-Agent Header',\
  tag:'protocol-violation',ver:'OWASP_CRS/4.0',severity:'NOTICE',\
  setvar:'tx.inbound_anomaly_score_pl1=+%{tx.notice_anomaly_score}'"
SecRule REQUEST_HEADERS:User-Agent "@rx ^\s*$" \
  "id:920321,phase:1,block,msg:'Empty User-Agent Header (lab-hard strict)',\
  tag:'protocol-violation',ver:'lab-hard/1.0',severity:'NOTICE',\
  setvar:'tx.inbound_anomaly_score_pl1=+%{tx.notice_anomaly_score}'"

# --- Ban 10x403/60s => 429 (matches injekt waf.rs: 403/406 block, 429 rate-limit) ---
SecAction "id:901200,phase:1,nolog,pass,initcol:ip=%{REMOTE_ADDR}"
SecRule RESPONSE_STATUS "@streq 403" \
  "id:901201,phase:5,pass,nolog,setvar:ip.f403_counter=+1,expirevar:ip.f403_counter=60"
SecRule IP:F403_COUNTER "@ge 10" \
  "id:901202,phase:1,deny,status:429,log,msg:'lab-hard ban 10x403/60s',\
  setvar:ip.blocked=1,expirevar:ip.blocked=60,setvar:!ip.f403_counter"
SecRule IP:BLOCKED "@eq 1" \
  "id:901203,phase:1,deny,status:429,log,msg:'lab-hard banned',logdata:'%{REMOTE_ADDR}'"
